<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner — DOM &amp; Events Exercise</title>
    <link rel="stylesheet" href="styles.css" />
    <!--
      Classic script, deferred — NOT type="module".
      This lets the page open directly over file:// with no server,
      since browsers block ES modules over the file:// protocol.
      dom-events.js is created in a later task (4.2).
    -->
    <script src="dom-events.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Study Planner</h1>

      <!-- Add-task form: each control has an explicit <label for> matched to its id. -->
      <form id="task-form">
        <div>
          <label for="task-title">Task title</label>
          <input type="text" id="task-title" name="task-title" autocomplete="off" />
        </div>
        <div>
          <label for="task-minutes">Minutes</label>
          <input type="number" id="task-minutes" name="task-minutes" min="1" step="1" />
        </div>
        <button type="submit">Add task</button>
      </form>

      <!-- Error region: the script writes validation messages here. -->
      <p id="task-error" role="alert"></p>

      <!-- Empty task list: the script selects this by id and delegates clicks on it. -->
      <ul id="task-list"></ul>

      <!-- Summary region: polite live updates as tasks change. -->
      <p id="task-summary" aria-live="polite"></p>

      <!-- Compact-mode toggle: starts unpressed. -->
      <button type="button" id="compact-toggle" aria-pressed="false">
        Toggle compact mode
      </button>
    </main>
  </body>
</html>
